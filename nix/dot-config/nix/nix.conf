# Nix user configuration (XDG: ~/.config/nix/nix.conf)
#
# Enable flakes and the unified `nix` CLI. These are still flagged as
# "experimental" upstream but are the de facto modern default, and are needed
# for `nix profile add nixpkgs#...`, `nix flake`, etc.
#
# This is portable across machines (Arch + Nix, macOS + Nix). On NixOS you'd
# typically set `nix.settings.experimental-features` in your system config
# instead, but having this user file too is harmless.
experimental-features = nix-command flakes
